<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Verifying your license — ManuMan Mobility</title>
  <link rel="stylesheet" href="style.css?v=2" />
</head>
<body>
  <main style="min-height:100vh;display:grid;place-items:center;padding:24px;background:#f4f6f9;">
    <section class="bmodal" style="max-width:560px;margin:0;padding:32px;text-align:center;">
      <div style="font-size:2.5rem;color:#F5A800;">🛡️</div>
      <h1 style="color:#0d1b2a;margin:16px 0 8px;">Checking your license</h1>
      <p id="identityMessage" style="color:#666;line-height:1.6;">Stripe is securely reviewing your document and selfie. This usually takes less than a minute.</p>
      <button id="identityRetry" class="btn-primary" style="display:none;margin:18px auto 0;">Check again</button>
      <a href="booking.html" style="display:block;margin-top:18px;color:#0d1b2a;">Return to booking</a>
    </section>
  </main>
  <script src="config.js?v=3"></script>
  <script>
    const message = document.getElementById('identityMessage');
    const retry = document.getElementById('identityRetry');
    async function checkIdentity() {
      const draft = JSON.parse(sessionStorage.getItem('pendingBooking') || 'null');
      if (!draft?.identityVerificationSessionId || !draft?.identityProof) {
        message.textContent = 'No verification session was found. Please start your booking again.';
        return;
      }
      message.textContent = 'Checking your verification status…';
      retry.style.display = 'none';
      try {
        const response = await fetch(`${API}/identity/verification-sessions/${encodeURIComponent(draft.identityVerificationSessionId)}?email=${encodeURIComponent(draft.customerEmail)}`, {
          headers: { 'X-Identity-Proof': draft.identityProof }
        });
        const result = await response.json().catch(() => ({}));
        if (!response.ok) throw new Error(result.message || 'Could not check your verification.');
        if (result.status === 'verified') {
          message.textContent = 'License verified. Taking you to secure payment…';
          setTimeout(() => window.location.replace('payment.html'), 700);
          return;
        }
        if (result.status === 'processing') {
          message.textContent = 'Your document is still being checked. Please wait a moment, then check again.';
        } else {
          message.textContent = 'Your verification needs more information. Return to booking and start the secure verification again.';
        }
      } catch (error) {
        message.textContent = error.message || 'Could not check your verification.';
      }
      retry.style.display = 'inline-flex';
    }
    retry.addEventListener('click', checkIdentity);
    checkIdentity();
  </script>
</body>
</html>
